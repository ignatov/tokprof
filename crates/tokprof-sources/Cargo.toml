[package]
name = "tokprof-sources"
description = "The log sources tokprof reads, as one catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["claude-code", "codex", "pi", "opencode"]
claude-code = ["dep:tokprof-source-claude-code"]
codex = ["dep:tokprof-source-codex"]
pi = ["dep:tokprof-source-pi"]
opencode = ["dep:tokprof-source-opencode"]

[dependencies]
tokprof-core.workspace = true
tokprof-source-claude-code = { workspace = true, optional = true }
tokprof-source-codex = { workspace = true, optional = true }
tokprof-source-pi = { workspace = true, optional = true }
tokprof-source-opencode = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
