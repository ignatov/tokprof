# OpenAI cut GPT-5.6 Sol by 20-33% on 2026-08-21 "for the next 3 months" (community.openai.com/t/1391726);
# on 2026-11-10 the pricing page says the cut runs until 2026-11-30, without the price after it. Archived copies of the pricing page show the old
# rates at 2026-08-21 10:30 UTC and the new ones a day later.
[[models."gpt-5.6-sol"]]
since = 2026-08-21
input = 4.00
cache_write = 5.00
cache_write_long = 10.00
cache_read = 0.40
output = 20.00
long_context = { above = 272_000, input = 8.00, cache_write = 10.00, cache_write_long = 20.00, cache_read = 0.80, output = 30.00 }

# Launch prices, from the archived pricing page of 2026-07-31 to 2026-08-21, before the 12h
# cache lifetime existed.
