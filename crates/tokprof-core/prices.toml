# tokprof model prices, in USD per million tokens. Built into the binary as the defaults.
#
# Overrides are read from ~/.config/tokprof/prices.toml (or $XDG_CONFIG_HOME/tokprof/prices.toml),
# then from --prices FILE. An entry there replaces the entry for the same model here.
#
# Model ids match by prefix: "claude-sonnet-4-5" also prices "claude-sonnet-4-5-20250929" and
# "gpt-5.1" prices "gpt-5.1-codex". A prefix never matches another version: "claude-opus-5" does
# not price "claude-opus-5-7", and "gpt-5" does not price "gpt-5.7-sol".
#
# Fields:
#   input             prompt tokens neither read from nor written to the cache
#   output            generated tokens, reasoning included
#   cache_read        prompt tokens read from the cache; defaults to input
#   cache_write       cache writes with the short lifetime (Anthropic 5m, OpenAI 30m);
#                     defaults to input, for models that do not charge for writes
#   cache_write_long  cache writes with the long lifetime (Anthropic 1h, OpenAI 12h);
#                     defaults to cache_write
#   long_context      prices for requests whose prompt is over `above` tokens, same fields
#   context_window    context window in tokens, for the context bar of `tokprof`; Codex logs
#                     its own
#   since, until      when the prices were in effect, `until` excluded: a date (2026-08-21) or a
#                     date-time (2026-08-21T17:00:00Z), UTC unless it has an offset
#
# Prices change over time. A model with history is an array of periods, [[models."id"]], and a
# request is priced by the period in effect when it was sent. Older sessions keep the prices of
# their time. A model with a gap between its periods has no price inside the gap.

# Anthropic: platform.claude.com/docs/en/about-claude/pricing, checked 2026-11-10.
# Claude 4.6 and later, except Haiku 5.5, bill the full 1M context at these rates.

[models."claude-fable-5-2"]
input = 8.00
cache_write = 10.00
cache_write_long = 16.00
cache_read = 0.20
output = 40.00
context_window = 1_000_000

