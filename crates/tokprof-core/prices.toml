# OpenAI: developers.openai.com/api/docs/pricing, Standard tier, checked 2026-11-10.
# codex-auto-review, Codex's approval reviewer, is not on the page and stays without a price.
# Long context means more than 272K input tokens. Fast mode (2x) is not detected in Codex logs.
# GPT-5.6 and later charge for cache writes (30m and 12h lifetimes); earlier models do not.

[models."gpt-6-astra"]
input = 10.00
cache_write = 12.50
cache_write_long = 25.00
cache_read = 1.00
output = 50.00
