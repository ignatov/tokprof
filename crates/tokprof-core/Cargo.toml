[package]
name = "tokprof-core"
description = "The tokprof library: session model, pricing, cost attribution and prompt-cache analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["export"]
# The pprof writer (`.pb.gz`, `.pprof`, `.pb`).
export = ["dep:prost", "dep:flate2"]
# The checks every log source must pass, for the sources' tests.
testkit = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
flate2 = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
