# The window is a workspace of its own: the root workspace and the checks of every push neither
# fetch nor build Rune while Rune is pre-release; only the release's macOS jobs build it, as the
# Mac app. Its version follows tokprof's, and the release checks the tag against both.
[workspace]

[package]
name = "tokprof-desk"
description = "The session browser of tokprof in a native window"
version = "0.1.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/ignatov/tokprof"
publish = false

[dependencies]
tokprof-browse = { path = "../tokprof-browse" }
tokprof-core = { path = "../tokprof-core" }
tokprof-sources = { path = "../tokprof-sources" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
# setsid, so that the window started from a terminal outlives it.
libc = "0.2"
# Rune is pre-release and its `dev` branch is never rewritten: pin a full rev of it, and move it
# in a commit of its own (README.md says how).
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", default-features = false, features = ["accessibility", "metal-backend"] }
# The color themes, read from themes/themes.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The menu bar countdown: AppKit's status item, at the versions Rune's winit already builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSButton", "NSControl", "NSFont", "NSFontDescriptor", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSProcessInfo", "NSString"] }

[dev-dependencies]
tokprof-source-claude-code = { path = "../../sources/claude-code" }
tempfile = "3"

[profile.release]
debug = "line-tables-only"
