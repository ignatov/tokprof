<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- tokprof's icon: the day's lanes of the window on a dark tile. The tile follows macOS's
       icon grid: 824 points on a 1024 canvas, with a shadow under it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30323a"/>
      <stop offset="1" stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc26f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4cc26f" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="inside">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <g clip-path="url(#inside)">
    <!-- the hours -->
    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="4">
      <line x1="232" y1="100" x2="232" y2="924"/>
      <line x1="372" y1="100" x2="372" y2="924"/>
      <line x1="512" y1="100" x2="512" y2="924"/>
      <line x1="652" y1="100" x2="652" y2="924"/>
      <line x1="792" y1="100" x2="792" y2="924"/>
    </g>
    <!-- the time after now -->
    <rect x="712" y="100" width="212" height="824" fill="#ffffff" fill-opacity="0.035"/>
    <g transform="translate(0 48)">
    <!-- you were there -->
    <rect x="180" y="268" width="250" height="40" rx="12" fill="#82a0eb" fill-opacity="0.55"/>
    <rect x="510" y="268" width="202" height="40" rx="12" fill="#82a0eb" fill-opacity="0.55"/>
    <!-- a session that works, waits for you, and works on: warm past now -->
    <rect x="200" y="378" width="150" height="56" rx="10" fill="#4cc26f"/>
    <rect x="356" y="378" width="130" height="56" rx="10" fill="#e6b63c" fill-opacity="0.85"/>
    <rect x="492" y="378" width="190" height="56" rx="10" fill="#4cc26f"/>
    <rect x="682" y="394" width="210" height="24" fill="url(#tail)"/>
    <!-- a second one, its cache cooling -->
    <rect x="262" y="498" width="118" height="56" rx="10" fill="#4cc26f"/>
    <rect x="386" y="498" width="112" height="56" rx="10" fill="#e6b63c" fill-opacity="0.85"/>
    <rect x="504" y="498" width="74" height="56" rx="10" fill="#4cc26f"/>
    <rect x="578" y="514" width="168" height="24" fill="url(#tail)"/>
    <!-- an older one, gone cold -->
    <rect x="180" y="618" width="124" height="56" rx="10" fill="#4cc26f"/>
    <rect x="304" y="634" width="176" height="24" fill="url(#tail)"/>
    <rect x="476" y="620" width="8" height="52" rx="4" fill="#4cc26f" fill-opacity="0.6"/>
    <!-- messages -->
    <rect x="196" y="368" width="10" height="76" rx="5" fill="#4dbad8"/>
    <rect x="488" y="368" width="10" height="76" rx="5" fill="#4dbad8"/>
    <rect x="258" y="488" width="10" height="76" rx="5" fill="#4dbad8"/>
    </g>
    <!-- now -->
    <rect x="706" y="196" width="12" height="640" rx="6" fill="#ff5f57"/>
    <circle cx="712" cy="196" r="22" fill="#ff5f57"/>
  </g>
</svg>
