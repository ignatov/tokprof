[package]
name = "tokprof"
version = "0.1.0"
edition = "2024"
description = "Token, cost and prompt-cache profiler for AI coding-agent session logs"
publish = false

[dependencies]
ansi-to-tui = "8"
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
notify = "8"
prost = "0.13"
ratatui = "0.30"
rayon = "1.10"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[profile.release]
debug = "line-tables-only"
