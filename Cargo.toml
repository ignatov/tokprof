[workspace]
resolver = "3"
members = ["crates/tokprof-core", "crates/tokprof-logio", "crates/tokprof-sources", "crates/tokprof", "sources/claude-code", "sources/codex"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ignatov/tokprof"
publish = false

[workspace.dependencies]
tokprof-core = { path = "crates/tokprof-core" }
tokprof-logio = { path = "crates/tokprof-logio" }
tokprof-sources = { path = "crates/tokprof-sources" }
tokprof-source-claude-code = { path = "sources/claude-code" }
tokprof-source-codex = { path = "sources/codex" }
ansi-to-tui = "8"
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
notify = "8"
prost = "0.13"
ratatui = "0.30"
rayon = "1.10"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[profile.release]
debug = "line-tables-only"
