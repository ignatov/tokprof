[workspace]
resolver = "3"
members = ["crates/tokprof-core", "crates/tokprof-logio", "crates/tokprof-sources", "crates/tokprof-browse", "crates/tokprof", "sources/claude-code", "sources/codex", "sources/pi", "sources/opencode"]
# The window builds in a workspace of its own, so that this one never fetches Rune.
exclude = ["crates/tokprof-desk"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/ignatov/tokprof"
publish = false

[workspace.dependencies]
tokprof-core = { path = "crates/tokprof-core" }
tokprof-logio = { path = "crates/tokprof-logio" }
tokprof-sources = { path = "crates/tokprof-sources" }
tokprof-browse = { path = "crates/tokprof-browse" }
tokprof-source-claude-code = { path = "sources/claude-code" }
tokprof-source-codex = { path = "sources/codex" }
tokprof-source-pi = { path = "sources/pi" }
tokprof-source-opencode = { path = "sources/opencode" }
ansi-to-tui = "8"
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
notify = "8"
prost = "0.13"
ratatui = "0.30"
rayon = "1.10"
# The bundled SQLite builds from C on every release target, with no system library.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
# The bundled zstd builds from C on every release target, with no system library.
zstd = "0.14"

[profile.release]
debug = "line-tables-only"
